<!doctype html>

<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />

<title>MX$ — Calculadora</title>

<!-- Ícones e favicon -->
<link rel="icon" href="1762965844618.jpg" type="image/jpeg">
<link rel="apple-touch-icon" href="1762965844618.jpg">

<style>

:root{
  font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif
}

body{
  background:#f6f7fb;
  color:#111;
  margin:0;
  padding:24px;
  display:flex;
  justify-content:center
}

.container{
  width:980px;
  max-width:96%;
  background:#fff;
  border-radius:12px;
  box-shadow:0 6px 30px rgba(20,25,40,0.08);
  padding:22px
}

h1{
  font-size:40px;
  margin:0 0 14px;
  color:#0b3b66
}

.row{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:12px
}

label{
  font-size:13px;
  color:#334;
  display:block;
  margin-bottom:6px
}

input[type="text"],
input[type="number"]{
  padding:10px 12px;
  border:1px solid #d7dde8;
  border-radius:8px;
  font-size:14px;
  width:100%;
  box-sizing:border-box
}

.col{
  flex:1;
  min-width:140px
}

.small{
  width:140px
}

.btn{
  background:#0b66a3;
  color:#fff;
  padding:10px 14px;
  border-radius:8px;
  border:0;
  cursor:pointer;
  font-weight:600
}

.btn.secondary{
  background:#28a745;
  color:#fff
}

.btn.secondary:hover{
  background:#218838
}

.btn.danger{
  background:#e24b4b
}

.btn.resetAposta{
  background:#f39c12;
  color:#fff
}

.btn.resetAposta:hover{
  background:#d68910
}

.output{
  background:#f3f6fb;
  padding:12px;
  border-radius:8px;
  border:1px solid #e8edf6
}

.summary{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:8px
}

.card{
  flex:1;
  min-width:220px;
  padding:12px;
  border-radius:8px;
  background:#fff;
  border:1px solid #eef3fa
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px
}

th,td{
  padding:8px;
  border-bottom:1px solid #f0f3f8;
  text-align:left;
  font-size:13px
}

th{
  background:#fbfdff;
  font-weight:700
}

.profit{
  background:#eaffef
}

.loss{
  background:#fff0f0
}

.small-note{
  font-size:12px;
  color:#6b7a8a;
  margin-top:4px
}

/* RESULTADOS */
.retorno-positivo{
  color:#168a32;
  font-weight:700
}

.retorno-negativo{
  color:#d62828;
  font-weight:700
}

.retorno-neutro{
  color:#333;
  font-weight:700
}

</style>
</head>

<body>

<div class="container">

<h1>MX$</h1>


<!-- ========================================================= -->
<!-- SALDO -->
<!-- ========================================================= -->

<div class="row" style="align-items:end">

  <div class="col small">

    <label for="saldoInicial">Saldo inicial (R$)</label>

    <input
      id="saldoInicial"
      type="text"
      inputmode="decimal"
      value="0.00"
    />

  </div>


  <div class="col small">

    <label for="saldoAtual">Saldo atual (R$)</label>

    <input
      id="saldoAtual"
      type="text"
      readonly
    />

    <div class="small-note">
      Saldo = inicial + histórico
    </div>

  </div>


  <div class="col">

    <label>Histórico acumulado (R$)</label>

    <input
      id="histAcumulado"
      type="text"
      readonly
    />

  </div>


  <div class="col small">

    <label>% do saldo inicial</label>

    <input
      id="histPercentual"
      type="text"
      readonly
    />

  </div>

</div>


<!-- ========================================================= -->
<!-- TIMES -->
<!-- ========================================================= -->

<div class="row">

  <div class="col">

    <label>Time A</label>

    <input
      id="timeA"
      type="text"
      placeholder="Nome do time A"
    />

  </div>


  <div class="col">

    <label>Time B</label>

    <input
      id="timeB"
      type="text"
      placeholder="Nome do time B"
    />

  </div>

</div>


<!-- ========================================================= -->
<!-- ODDS -->
<!-- ========================================================= -->

<div class="row">

  <div class="col small">

    <label>Odd 1</label>

    <input
      id="oddA"
      type="number"
      step="0.01"
      min="1"
    />

  </div>


  <div class="col small">

    <label>Odd 2</label>

    <input
      id="oddB"
      type="number"
      step="0.01"
      min="1"
    />

  </div>


  <div class="col small">

    <label>Valor total a apostar (R$)</label>

    <input
      id="valorTotal"
      type="number"
      step="0.01"
      min="0"
    />

  </div>

</div>


<!-- ========================================================= -->
<!-- APOSTA ÚNICA -->
<!-- ========================================================= -->

<div
  class="row"
  style="align-items:center;border-top:1px solid #eef2f9;padding-top:10px;margin-top:12px;"
>

  <div class="col small">

    <label>

      <input
        type="checkbox"
        id="modoUnico"
      />

      Usar aposta única (valor total em odd 1)

    </label>

  </div>

</div>


<!-- ========================================================= -->
<!-- MULTIPLICADORES + QTD PERDAS -->
<!-- ========================================================= -->

<div
  class="row"
  style="align-items:end;border-top:1px solid #eef2f9;padding-top:10px;margin-top:12px;"
>

  <div class="col small">

    <label for="mult2Perdas">
      × 2 perdas
    </label>

    <input
      id="mult2Perdas"
      type="number"
      step="0.01"
      min="0"
      value="1.00"
    />

  </div>


  <div class="col small">

    <label for="mult1Perda">
      × 1 perda
    </label>

    <input
      id="mult1Perda"
      type="number"
      step="0.01"
      min="0"
      value="1.00"
    />

  </div>


  <div class="col small">

    <label for="mult2Vitorias">
      × 2 acertos
    </label>

    <input
      id="mult2Vitorias"
      type="number"
      step="0.01"
      min="0"
      value="1.00"
    />

  </div>


  <div class="col small">

    <label for="qtdPerdidas">
      Quantas apostas perderam?
    </label>

    <input
      id="qtdPerdidas"
      type="number"
      step="1"
      min="0"
      max="2"
      value="0"
    />

    <div
      id="qtdPerdidasNota"
      class="small-note"
    >
      0, 1 ou 2
    </div>

  </div>

</div>


<!-- ========================================================= -->
<!-- BOTÕES -->
<!-- ========================================================= -->

<div class="row">

  <button
    id="btnCalcular"
    class="btn"
  >
    Calcular distribuição
  </button>


  <button
    id="btnConcluir"
    class="btn secondary"
  >
    Aposta concluída
  </button>


  <button
    id="btnResetAposta"
    class="btn resetAposta"
  >
    Resetar aposta
  </button>


  <button
    id="btnResetHist"
    class="btn danger"
  >
    Resetar histórico
  </button>

</div>


<!-- ========================================================= -->
<!-- RESULTADOS -->
<!-- ========================================================= -->

<div class="output">

  <div class="summary">


    <!-- DISTRIBUIÇÃO -->

    <div class="card">

      <strong>Distribuição</strong>

      <div
        id="distInfo"
        class="small-note"
      >
        Nenhum cálculo ainda.
      </div>

    </div>


    <!-- 1 ACERTO -->

    <div class="card">

      <strong>Se 1 acerta</strong>

      <div
        id="oneWin"
        class="small-note"
      >
        —
      </div>

    </div>


    <!-- 2 ACERTOS -->

    <div class="card">

      <strong>Se 2 acertam</strong>

      <div
        id="bothWin"
        class="small-note"
      >
        —
      </div>

    </div>


  </div>

</div>


<!-- ========================================================= -->
<!-- HISTÓRICO -->
<!-- ========================================================= -->

<h3>Histórico</h3>

<div class="small-note">
# | data | valor apostado | lucro/prejuízo | %
</div>

<table id="histTable">

  <thead>

    <tr>

      <th>#</th>
      <th>Data</th>
      <th>Valor</th>
      <th>Resultado</th>
      <th>%</th>

    </tr>

  </thead>

  <tbody></tbody>

</table>

</div>


<script>

(function(){


/* ========================================================= */
/* ELEMENTOS */
/* ========================================================= */

const saldoInicialEl =
  document.getElementById('saldoInicial');

const saldoAtualEl =
  document.getElementById('saldoAtual');

const histAcumuladoEl =
  document.getElementById('histAcumulado');

const histPercentualEl =
  document.getElementById('histPercentual');

const oddAEl =
  document.getElementById('oddA');

const oddBEl =
  document.getElementById('oddB');

const valorTotalEl =
  document.getElementById('valorTotal');

const qtdPerdidasEl =
  document.getElementById('qtdPerdidas');

const qtdPerdidasNota =
  document.getElementById('qtdPerdidasNota');

const distInfo =
  document.getElementById('distInfo');

const oneWin =
  document.getElementById('oneWin');

const bothWin =
  document.getElementById('bothWin');

const histTbody =
  document.querySelector('#histTable tbody');

const mult2Perdas =
  document.getElementById('mult2Perdas');

const mult1Perda =
  document.getElementById('mult1Perda');

const mult2Vitorias =
  document.getElementById('mult2Vitorias');

const modoUnicoEl =
  document.getElementById('modoUnico');

const btnResetAposta =
  document.getElementById('btnResetAposta');


/* ========================================================= */
/* CHAVES LOCALSTORAGE */
/* ========================================================= */

const KEY_SALDO =
  'mx_saldo';

const KEY_HIST =
  'mx_hist';

const KEY_MULT =
  'mx_mults';

const KEY_UNDO =
  'mx_undo_apostas';

/*
 * NOVO:
 * Armazena o valor da próxima aposta.
 */
const KEY_VALOR_APOSTA =
  'mx_valor_aposta';


/* ========================================================= */
/* VARIÁVEIS */
/* ========================================================= */

let saldoInicial = 0;

let history = [];

let mults = {
  p2:1,
  p1:1,
  v2:1
};

let undoStates = [];


/* ========================================================= */
/* FORMATAÇÃO */
/* ========================================================= */

const fmt = v =>
  Number(v).toLocaleString(
    'pt-BR',
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );


const now = () =>
  new Date().toLocaleString('pt-BR');


/* ========================================================= */
/* SALVAR DADOS */
/* ========================================================= */

function save(){

  localStorage.setItem(
    KEY_SALDO,
    saldoInicial
  );

  localStorage.setItem(
    KEY_HIST,
    JSON.stringify(history)
  );

  localStorage.setItem(
    KEY_MULT,
    JSON.stringify(mults)
  );

  localStorage.setItem(
    KEY_UNDO,
    JSON.stringify(undoStates)
  );

  /*
   * NOVO:
   * Salva permanentemente o valor da próxima aposta.
   */
  localStorage.setItem(
    KEY_VALOR_APOSTA,
    valorTotalEl.value || ''
  );

}


/* ========================================================= */
/* CARREGAR DADOS */
/* ========================================================= */

function load(){

  saldoInicial =
    parseFloat(
      localStorage.getItem(KEY_SALDO)
    ) || 0;


  history =
    JSON.parse(
      localStorage.getItem(KEY_HIST) || '[]'
    );


  mults =
    JSON.parse(
      localStorage.getItem(
        KEY_MULT
      ) ||
      '{"p2":1,"p1":1,"v2":1}'
    );


  undoStates =
    JSON.parse(
      localStorage.getItem(
        KEY_UNDO
      ) || '[]'
    );


  /*
   * NOVO:
   * Recupera o valor da próxima aposta.
   */
  const valorSalvo =
    localStorage.getItem(
      KEY_VALOR_APOSTA
    );


  if(
    valorSalvo !== null &&
    valorSalvo !== ''
  ){

    valorTotalEl.value =
      valorSalvo;

  }


  /*
   * Saldo inicial sempre com 2 casas.
   */
  saldoInicialEl.value =
    Number(saldoInicial).toFixed(2);


  mult2Perdas.value =
    mults.p2;

  mult1Perda.value =
    mults.p1;

  mult2Vitorias.value =
    mults.v2;


  atualizarLimitePerdas();

  atualizarBotaoResetAposta();

  render();

}


/* ========================================================= */
/* RENDERIZAR */
/* ========================================================= */

function render(){

  const totalHist =
    history.reduce(
      (s,i) =>
        s + i.resultado,
      0
    );


  /*
   * Histórico acumulado.
   */
  histAcumuladoEl.value =
    'R$ ' + fmt(totalHist);


  /*
   * Saldo atual.
   */
  saldoAtualEl.value =
    'R$ ' +
    fmt(
      saldoInicial +
      totalHist
    );


  /*
   * Percentual que o histórico
   * representa em relação ao saldo inicial.
   */
  let percentualInicial = 0;


  if(saldoInicial !== 0){

    percentualInicial =
      (totalHist / saldoInicial) *
      100;

  }


  histPercentualEl.value =
    (percentualInicial >= 0 ? '+' : '') +
    percentualInicial.toFixed(2) +
    '%';


  /*
   * Histórico das apostas.
   */
  histTbody.innerHTML = '';


  history.forEach((it,i)=>{

    const tr =
      document.createElement('tr');


    tr.className =
      it.resultado >= 0
        ? 'profit'
        : 'loss';


    tr.innerHTML =
      `<td>${i+1}</td>
       <td>${it.data}</td>
       <td>R$ ${fmt(it.valor)}</td>
       <td>
         ${it.resultado>=0?'+':'-'}
         R$ ${fmt(Math.abs(it.resultado))}
       </td>
       <td>
         ${it.percent>=0?'+':'-'}
         ${Math.abs(it.percent).toFixed(2)}%
       </td>`;


    histTbody.appendChild(tr);

  });

}


/* ========================================================= */
/* BOTÃO RESETAR APOSTA */
/* ========================================================= */

function atualizarBotaoResetAposta(){

  btnResetAposta.disabled =
    (undoStates.length === 0);


  if(
    undoStates.length === 0
  ){

    btnResetAposta.style.opacity =
      '0.5';

    btnResetAposta.style.cursor =
      'not-allowed';

  }else{

    btnResetAposta.style.opacity =
      '1';

    btnResetAposta.style.cursor =
      'pointer';

  }

}


/* ========================================================= */
/* SALDO INICIAL */
/* ========================================================= */

saldoInicialEl.addEventListener(
  'change',
  ()=>{

    saldoInicial =
      parseFloat(
        saldoInicialEl.value
      ) || 0;


    /*
     * Força 2 casas decimais.
     */
    saldoInicialEl.value =
      saldoInicial.toFixed(2);


    save();

    render();

  }
);


/* ========================================================= */
/* VALOR TOTAL DA APOSTA */
/* ========================================================= */

/*
 * NOVO:
 * Sempre que o usuário alterar manualmente
 * o valor da próxima aposta, ele é salvo.
 */

valorTotalEl.addEventListener(
  'change',
  ()=>{

    save();

  }
);


/* ========================================================= */
/* MULTIPLICADORES */
/* ========================================================= */

[
  mult2Perdas,
  mult1Perda,
  mult2Vitorias
].forEach(el=>{

  el.addEventListener(
    'change',
    ()=>{

      mults.p2 =
        parseFloat(
          mult2Perdas.value
        ) || 1;


      mults.p1 =
        parseFloat(
          mult1Perda.value
        ) || 1;


      mults.v2 =
        parseFloat(
          mult2Vitorias.value
        ) || 1;


      save();

    }
  );

});


/* ========================================================= */
/* LIMITE DE PERDAS */
/* ========================================================= */

function atualizarLimitePerdas(){

  if(
    modoUnicoEl.checked
  ){

    qtdPerdidasEl.max = 1;

    qtdPerdidasNota.textContent =
      '0 ou 1';


    if(
      parseInt(
        qtdPerdidasEl.value
      ) > 1
    ){

      qtdPerdidasEl.value = 1;

    }

  }else{

    qtdPerdidasEl.max = 2;

    qtdPerdidasNota.textContent =
      '0, 1 ou 2';

  }

}


modoUnicoEl.addEventListener(
  'change',
  ()=>{

    atualizarLimitePerdas();

  }
);


/* ========================================================= */
/* FUNÇÃO CALCULAR */
/* ========================================================= */

function calcular(){

  const o1 =
    parseFloat(
      oddAEl.value
    );

  const o2 =
    parseFloat(
      oddBEl.value
    );

  const T =
    parseFloat(
      valorTotalEl.value
    );

  const unico =
    modoUnicoEl.checked;


  /* ======================================================= */
  /* APOSTA ÚNICA */
  /* ======================================================= */

  if(unico){

    if(
      !(o1 > 0 && T > 0)
    ){

      alert(
        'Preencha pelo menos a Odd 1 e o valor total.'
      );

      return null;

    }


    const A1 = T;

    const A2 = 0;

    const R =
      A1 * o1;

    const profit1 =
      R - A1;


    return {

      o1,
      o2:0,
      T,
      A1,
      A2,
      R,
      profit1,
      profitBoth:profit1,
      unico:true

    };

  }


  /* ======================================================= */
  /* MODO NORMAL */
  /* ======================================================= */

  if(
    !(o1 > 0 &&
      o2 > 0 &&
      T > 0)
  ){

    alert(
      'Preencha ambas as odds e o valor total.'
    );

    return null;

  }


  const inv1 =
    1 / o1;

  const inv2 =
    1 / o2;

  const sumInv =
    inv1 + inv2;


  const A1 =
    (T / o1) /
    sumInv;


  const A2 =
    (T / o2) /
    sumInv;


  const R =
    T / sumInv;


  const ret1 =
    R;

  const profit1 =
    ret1 - T;


  const retBoth =
    A1 * o1 +
    A2 * o2;


  const profitBoth =
    retBoth - T;


  return {

    o1,
    o2,
    T,
    A1,
    A2,
    R,
    profit1,
    profitBoth,
    unico:false

  };

}


/* ========================================================= */
/* FORMATAR RESULTADO */
/* ========================================================= */

function formatarResultado(
  retorno,
  lucro
){

  const classe =
    lucro > 0
      ? 'retorno-positivo'
      : lucro < 0
        ? 'retorno-negativo'
        : 'retorno-neutro';


  const sinalLucro =
    lucro > 0
      ? '+'
      : lucro < 0
        ? '-'
        : '';


  return `
    <div>
      Retorno: R$ ${fmt(retorno)}
    </div>

    <div class="${classe}">
      ${sinalLucro}
      R$ ${fmt(Math.abs(lucro))}
    </div>
  `;

}


/* ========================================================= */
/* BOTÃO CALCULAR DISTRIBUIÇÃO */
/* ========================================================= */

document.getElementById(
  'btnCalcular'
).onclick = ()=>{

  const r =
    calcular();


  if(!r)return;


  /*
   * DISTRIBUIÇÃO
   */

  if(r.unico){

    distInfo.innerHTML =
      `Stake único: R$ ${fmt(r.A1)}
       (odd ${r.o1})`;

  }else{

    distInfo.innerHTML =
      `Stake 1: R$ ${fmt(r.A1)}
       (odd ${r.o1})<br>
       Stake 2: R$ ${fmt(r.A2)}
       (odd ${r.o2})`;

  }


  /*
   * 1 ACERTO
   *
   * Retorno = valor total recebido.
   * Lucro/prejuízo = retorno - valor apostado.
   */

  oneWin.innerHTML =
    formatarResultado(
      r.R,
      r.profit1
    );


  /*
   * 2 ACERTOS
   *
   * Retorno = valor total recebido.
   * Lucro/prejuízo = retorno - valor apostado.
   */

  bothWin.innerHTML =
    formatarResultado(
      r.unico
        ? r.R
        : r.A1*r.o1 + r.A2*r.o2,
      r.profitBoth
    );

};


/* ========================================================= */
/* APOSTA CONCLUÍDA */
/* ========================================================= */

document.getElementById(
  'btnConcluir'
).onclick = ()=>{

  const r =
    calcular();


  if(!r)return;


  let lost =
    parseInt(
      qtdPerdidasEl.value
    ) || 0;


  /* ======================================================= */
  /* APOSTA ÚNICA */
  /* ======================================================= */

  if(r.unico){

    if(lost > 1){

      alert(
        'No modo Aposta única, só pode haver 0 ou 1 aposta perdida.'
      );

      qtdPerdidasEl.value = 1;

      return;

    }

  }


  /* ======================================================= */
  /* SALVAR ESTADO ANTERIOR */
  /* ======================================================= */

  undoStates
